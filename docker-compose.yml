version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: alextec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: alextec
      POSTGRES_USER: alextec
      POSTGRES_PASSWORD: alextec123
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
